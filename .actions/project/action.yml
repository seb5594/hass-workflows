name: Validate, build, and publish a Home Assistant project
description: Shared pipeline for apps, HACS integrations and HACS dashboards (cards and themes)
inputs:
  multiarch-only:
    description: Publish one image index without architecture tags
    default: 'false'
  publish:
    description: Publish on the default branch or matching version tag (never from template repositories)
    default: 'true'
  draft:
    description: Create GitHub releases as drafts for review
    default: 'false'
  token:
    description: Token for the caller's releases, packages and README refresh
    required: true
  catalog-token:
    description: Optional token for the app catalog notification
    required: false
runs:
  using: composite
  steps:
    - uses: ./.engine/.actions/setup-python
      with:
        packages: flake8==7.3.0
    - name: Detect project from its own metadata
      id: project
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PUBLISH: ${{ inputs.publish }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        IS_TEMPLATE: ${{ github.event.repository.is_template }}
      run: python "$ENGINE/.scripts/project.py" inspect >> "$GITHUB_OUTPUT"
    # Dashboards (cards) are built with Node; the engine scripts themselves stay Python.
    - uses: actions/setup-node@v6
      if: steps.project.outputs.kind == 'dashboard'
      with:
        node-version: 24
    # Only apps lint shell scripts and YAML; GitHub's runner image usually ships both tools already.
    - name: Install shell and YAML linters
      if: steps.project.outputs.kind == 'app'
      shell: bash
      run: |
        if ! command -v shellcheck >/dev/null || ! command -v yamllint >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck yamllint
        fi
    - name: Validate metadata, documentation, code, and tests
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" validate
    - name: Validate app Dockerfile
      if: steps.project.outputs.kind == 'app'
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: ${{ steps.project.outputs.directory }}/Dockerfile
        # FROM ${BUILD_FROM} looks untagged to hadolint; validate_app.py checks the tag of its default.
        ignore: ${{ steps.project.outputs.apk_repository == 'true' && 'DL3006,DL3008,DL3018' || 'DL3006,DL3008' }}
    # HACS reads the repository through the public API, so private repositories cannot be checked.
    - name: Validate HACS repository
      if: steps.project.outputs.kind == 'integration' && github.repository != 'seb5594/hass-workflows' && github.event.repository.is_template != true && github.event.repository.private != true
      uses: hacs/action@main
      with:
        category: integration
        repository: ${{ github.repository }}
        # Catalog-only requirements are not needed for custom HACS repositories.
        ignore: ${{ steps.project.outputs.hacs_ignore }}
        comment: 'false'
    - uses: docker/setup-qemu-action@v4
      if: steps.project.outputs.images == 'true'
    - uses: docker/setup-buildx-action@v4
      if: steps.project.outputs.images == 'true'
    - name: Build and smoke-test every declared architecture
      if: steps.project.outputs.images == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" build
    - name: Package and verify the release files
      if: steps.project.outputs.kind == 'integration' || steps.project.outputs.kind == 'dashboard'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" package
    - name: Make verified integration ZIPs available from CI
      if: steps.project.outputs.kind == 'integration'
      uses: actions/upload-artifact@v7
      with:
        name: integration-zips
        path: dist/
    - name: Make the built card available from CI
      if: steps.project.outputs.kind == 'dashboard' && steps.project.outputs.category == 'plugin'
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-bundle
        path: dist/
    - uses: docker/login-action@v4
      if: steps.project.outputs.release == 'true' && steps.project.outputs.kind == 'app'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Publish images or ZIP release after all checks pass
      if: steps.project.outputs.release == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        ORCHESTRATION_TOKEN: ${{ inputs.catalog-token }}
        RELEASE_DRAFT: ${{ inputs.draft }}
        MULTIARCH_ONLY: ${{ inputs.multiarch-only }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" release
    # HACS installs a card from its release asset, so this check can only pass once a release exists:
    # it runs after publishing, never on pull requests, and not for private or template repositories.
    - name: Validate HACS dashboard repository
      if: steps.project.outputs.kind == 'dashboard' && github.event_name != 'pull_request' && github.event.repository.is_template != true && github.event.repository.private != true && (steps.project.outputs.release == 'true' || github.event_name == 'schedule')
      uses: hacs/action@main
      with:
        category: ${{ steps.project.outputs.category }}
        repository: ${{ github.repository }}
        ignore: ${{ steps.project.outputs.hacs_ignore }}
        comment: 'false'
    - name: Store measurements and refresh README badges with live values
      if: steps.project.outputs.publish == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" refresh-readme
