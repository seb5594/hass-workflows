name: Validate, build, and publish a Home Assistant project
description: Shared pipeline for apps and HACS integrations
inputs:
  publish:
    description: Publish on the default branch or matching version tag (never from template repositories)
    default: 'true'
  draft:
    description: Create GitHub releases as drafts for review
    default: 'false'
  token:
    description: Token for the caller's releases, packages and badge branch
    required: true
  catalog-token:
    description: Optional token for the app catalog notification
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install shared validation tools
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check PyYAML==6.0.3 flake8==7.3.0
        sudo apt-get update -qq
        sudo apt-get install -y shellcheck yamllint
    - name: Detect project from its own metadata
      id: project
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PUBLISH: ${{ inputs.publish }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        IS_TEMPLATE: ${{ github.event.repository.is_template }}
      run: python "$ENGINE/.scripts/project.py" inspect >> "$GITHUB_OUTPUT"
    - name: Validate metadata, documentation, code, and tests
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" validate
    - name: Validate app Dockerfile
      if: steps.project.outputs.kind == 'app'
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ steps.project.outputs.directory }}/Dockerfile
        ignore: DL3008
    # HACS reads the repository through the public API, so private repositories cannot be checked.
    - name: Validate HACS repository
      if: steps.project.outputs.kind == 'integration' && github.repository != 'seb5594/hass-workflows' && github.event.repository.is_template != true && github.event.repository.private != true
      uses: hacs/action@main
      with:
        category: integration
        repository: ${{ github.repository }}
        # Catalog-only requirements are not needed for custom HACS repositories.
        ignore: brands topics
        comment: 'false'
    - uses: docker/setup-qemu-action@v3
      if: steps.project.outputs.kind == 'app'
    - uses: docker/setup-buildx-action@v3
      if: steps.project.outputs.kind == 'app'
    - name: Build and smoke-test every declared architecture
      if: steps.project.outputs.kind == 'app'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" build
    - name: Package and verify HACS and manual ZIPs
      if: steps.project.outputs.kind == 'integration'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" package
    - name: Make verified integration ZIPs available from CI
      if: steps.project.outputs.kind == 'integration'
      uses: actions/upload-artifact@v4
      with:
        name: integration-zips
        path: dist/
    - uses: docker/login-action@v3
      if: steps.project.outputs.publish == 'true' && steps.project.outputs.kind == 'app'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Publish images or ZIP release after all checks pass
      if: steps.project.outputs.publish == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        ORCHESTRATION_TOKEN: ${{ inputs.catalog-token }}
        RELEASE_DRAFT: ${{ inputs.draft }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" release
    - name: Publish pipeline metrics as README badges
      if: steps.project.outputs.publish == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" publish-metrics
    - name: Refresh README badges with live values
      if: steps.project.outputs.publish == 'true'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" refresh-readme
