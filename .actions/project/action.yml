name: Validate, build, and publish a Home Assistant project
description: Shared pipeline for apps and HACS integrations
inputs:
  publish:
    description: Publish on the default branch or matching version tag
    default: 'true'
  token:
    description: Token for the caller's releases and packages
    required: true
  catalog-token:
    description: Optional token for the app catalog notification
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install shared validation tools
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check PyYAML==6.0.3 flake8==7.3.0
        sudo apt-get update -qq
        sudo apt-get install -y shellcheck yamllint
    - name: Detect project from its own metadata
      id: project
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
      run: python "$ENGINE/.scripts/project.py" inspect >> "$GITHUB_OUTPUT"
    - name: Validate metadata, documentation, Python, YAML, and shell
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" validate
    - name: Validate app Dockerfile
      if: steps.project.outputs.kind == 'app'
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ steps.project.outputs.directory }}/Dockerfile
        # FROM ${BUILD_FROM} looks untagged to hadolint; the default tag is pinned in the Dockerfile.
        ignore: DL3018,DL3008,DL3006
    - name: Validate HACS repository
      if: steps.project.outputs.kind == 'integration' && github.repository != 'seb5594/hass-workflows'
      uses: hacs/action@main
      with:
        category: integration
        repository: ${{ github.repository }}
        # Catalog-only requirements are not needed for custom HACS repositories.
        ignore: brands topics
        comment: 'false'
    - uses: docker/setup-qemu-action@v3
      if: steps.project.outputs.kind == 'app'
    - uses: docker/setup-buildx-action@v3
      if: steps.project.outputs.kind == 'app'
    - name: Build and smoke-test every declared architecture
      if: steps.project.outputs.kind == 'app'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" build
    - name: Package and verify HACS and manual ZIPs
      if: steps.project.outputs.kind == 'integration'
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" package
    - name: Make verified integration ZIPs available from CI
      if: steps.project.outputs.kind == 'integration'
      uses: actions/upload-artifact@v4
      with:
        name: integration-zips
        path: dist/
    - uses: docker/login-action@v3
      if: inputs.publish == 'true' && steps.project.outputs.kind == 'app' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Publish images or ZIP release after all checks pass
      if: inputs.publish == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        ORCHESTRATION_TOKEN: ${{ inputs.catalog-token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/project.py" release
