name: Validate and build Home Assistant app
description: Shared app checks and native or emulated container build
inputs:
  app:
    required: true
    description: App directory
  arch:
    required: true
    description: Home Assistant architecture
  platform:
    required: true
    description: Docker platform
runs:
  using: composite
  steps:
    - name: Install validation tools
      if: inputs.arch == 'amd64'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y shellcheck yamllint
        python -m pip install PyYAML==6.0.3
    - name: Validate source and shared entrypoint
      if: inputs.arch == 'amd64'
      shell: bash
      env:
        APP: ${{ inputs.app }}
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python "$ENGINE/.scripts/validate_app.py" "$APP"
        cmp "$ENGINE/.templates/entrypoint.sh" "$APP/entrypoint.sh"
        yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows "$APP/config.yaml"
        find "$APP" .github/tests -name '*.sh' -type f -print0 2>/dev/null | xargs -0 -r shellcheck -x
    - name: Validate Dockerfile
      if: inputs.arch == 'amd64'
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ inputs.app }}/Dockerfile
        ignore: DL3018,DL3008
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Build and smoke-test app
      shell: bash
      env:
        APP: ${{ inputs.app }}
        ARCH: ${{ inputs.arch }}
        PLATFORM: ${{ inputs.platform }}
        ENGINE: ${{ github.action_path }}/../..
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python -m pip install PyYAML==6.0.3
        python "$ENGINE/.scripts/build_app.py" "$APP" "$ARCH" "$PLATFORM"
