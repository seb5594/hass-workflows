name: Refresh the release-backed integration catalog
description: Refresh the release-backed integration catalog
inputs:
  token:
    description: Scoped token for the caller repository
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    - name: Refresh sources, metadata, checksums and README
      env:
        GH_TOKEN: ${{ inputs.token }}
      shell: bash
      run: python scripts/sync_catalog.py
    - name: Verify release catalog
      shell: bash
      run: python -m unittest discover -s tests -p 'test_*.py'
    - name: Commit changed catalog
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add .gitmodules .github/catalog.json catalog-feed.json README.md assets/brands custom_components/seb5594_integration_catalog/catalog.json
        if ! git diff --cached --quiet; then
          git commit -m 'chore: synchronize latest integration releases'
          git push
        fi
