name: Set up Python for the engine scripts
description: Python with PyYAML pinned in one place, plus optional extra packages
inputs:
  packages:
    description: Additional pip requirements, space separated
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
      # Unquoted on purpose: the extra packages are a space separated list.
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 $EXTRA_PACKAGES
