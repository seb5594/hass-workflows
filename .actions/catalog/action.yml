name: Synchronize the Home Assistant app catalog
description: Pin every matching app repository as a submodule and regenerate the catalog README
inputs:
  token:
    description: Token with read access to the owner's repositories
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install the catalog dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: Discover apps and update pinned submodules
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/catalog.py"
    - name: Commit and push only when something changed
      shell: bash
      env:
        TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add --all
        if git diff --cached --quiet; then
          echo "The app catalog is already up to date."
          exit 0
        fi
        git commit -m "chore: synchronize app submodules and catalog"
        git push origin "HEAD:${TARGET_BRANCH}"
