name: Keep the minimum Home Assistant version in step with the tests
description: Write the oldest release that passed together with every newer stable one into hacs.json
inputs:
  results:
    description: Directory with the result files of the matrix targets
    required: true
  expected:
    description: JSON list of the matrix targets that were started
    required: true
  refine:
    description: Bisect exact stable patches between the failed and the passed release
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.engine/.actions/setup-python
      with:
        packages: packaging==26.0 uv==0.13.9
    - id: minimum
      env:
        RESULTS: ${{ inputs.results }}
        EXPECTED: ${{ inputs.expected }}
        REFINE: ${{ inputs.refine == 'true' && '--refine' || '' }}
      shell: bash
      # Unquoted on purpose: REFINE is either empty or one flag.
      run: python .engine/.scripts/ha_minimum.py raise "$RESULTS" --expected "$EXPECTED" $REFINE | tee -a "$GITHUB_OUTPUT"
    - name: Commit the new minimum
      if: steps.minimum.outputs.changed == 'true'
      env:
        MINIMUM: ${{ steps.minimum.outputs.minimum }}
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add hacs.json
        git commit -m "chore: set the minimum Home Assistant version to $MINIMUM"
        # Publish evidence only for the revision that ran the tests. A newer push starts its own run.
        if [[ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" == "$GITHUB_SHA" ]]; then
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
        else
          echo "::notice::A newer revision superseded these compatibility results."
        fi
