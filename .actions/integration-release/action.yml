name: Publish integration ZIP release
description: Create HACS and manual installation archives with checksums
inputs:
  token:
    required: true
    description: Repository token with contents write permission
runs:
  using: composite
  steps:
    - name: Package and publish
      shell: bash
      env:
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python "$ENGINE/.scripts/package_integration.py" --release
