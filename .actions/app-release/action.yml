name: Publish validated app release
description: Publish five architecture images and synchronize the app catalog
inputs:
  app:
    required: true
    description: App directory
  token:
    required: true
    description: GitHub token for this repository and GHCR
  orchestration-token:
    required: true
    description: Token for the distribution repository dispatch
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - shell: bash
      env:
        APP: ${{ inputs.app }}
        ENGINE: ${{ github.action_path }}/../..
        GH_TOKEN: ${{ inputs.token }}
        ORCHESTRATION_TOKEN: ${{ inputs.orchestration-token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python -m pip install PyYAML==6.0.3
        python "$ENGINE/.scripts/release_app.py" "$APP"
