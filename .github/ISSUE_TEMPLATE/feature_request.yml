name: ✨ Feature Request
description: Suggest an idea or enhancement for this project.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We welcome your ideas and feature suggestions!
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Provide a detailed explanation of the proposed functionality.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Motivation
      description: Explain why this feature would be useful and what problem it solves.
