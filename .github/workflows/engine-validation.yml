name: Verify shared project engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  templates:
    name: Shared templates and metadata
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same Python and PyYAML as every project run; pytest for the Home Assistant matrix tests.
      - uses: ./.actions/setup-python
        with:
          packages: pytest==8.4.2 packaging==26.0
      - run: python -m unittest discover -s .github/tests -v
      - id: plan
        run: echo "projects=$(python .scripts/plan.py)" >> "$GITHUB_OUTPUT"
  project:
    name: ${{ matrix.kind }} / ${{ matrix.project }}
    needs: templates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.templates.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: seb5594/${{ matrix.project }}
          # Also reads private templates. With no ref, checkout selects each repository's default branch.
          token: ${{ secrets.ORCHESTRATION_PAT || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/project
        with:
          publish: 'false'
          token: ${{ github.token }}
