name: Verify shared project engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  templates:
    name: Shared templates and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python -m unittest discover -s .github/tests -v
  app:
    name: App / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project:
          - Home-Assistant-Rsync-Local-Addon
          - Home-Assistant-git-exporter-Addon
          - Home-Assistant-Playstation-VR-Camera-Loader-App
    steps:
      - uses: actions/checkout@v7
        with:
          repository: seb5594/${{ matrix.project }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/project
        with:
          publish: 'false'
          token: ${{ github.token }}
  integration:
    name: Integration / HACS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-pulseaudio_loopback_extended-integration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/project
        with:
          publish: 'false'
          token: ${{ github.token }}
