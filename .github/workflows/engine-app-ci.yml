name: Engine - App CI

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
    secrets:
      ORCHESTRATION_PAT:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64}
          - {arch: aarch64, platform: linux/arm64}
          - {arch: armv7, platform: linux/arm/v7}
          - {arch: armhf, platform: linux/arm/v6}
          - {arch: i386, platform: linux/386}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out private workflow engine
        uses: actions/checkout@v4
        with:
          repository: seb5594/hass-workflows
          ref: main
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/app-ci
        with:
          app: ${{ inputs.app_name }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
