name: Engine - Dashboard Generator

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: "ecosystem"
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  generate-readme:
    name: Rebuild Dashboard README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distribution Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Execute Generator Engine
        run: python3 .scripts/generate_readme.py --mode ${{ inputs.mode }}

      - name: Commit and Push Updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs(readme): auto-update ecosystem dashboard telemetry"
            git push origin main
          fi
