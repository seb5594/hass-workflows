name: Engine - App Multi-Arch GHCR Release

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      target_repo:
        required: false
        type: string
        default: "seb5594/Home-Assistant-Apps"
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  publish-ghcr-image:
    name: Build & Push Multi-Arch Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata / Tags for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/\({{ github.repository_owner }}/amd64-\){{ inputs.app_name }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.app_name }}
          file: ./${{ inputs.app_name }}/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  dispatch-update:
    needs: publish-ghcr-image
    name: Trigger Distribution Submodule Update
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Submodule Update Event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ inputs.target_repo }}
          event-type: update-submodule
          client-payload: '{"submodule": "\({{ github.event.repository.name }}", "sha": "\){{ github.sha }}"}'
