# The engine keeps its own copy: besides the workflows it also watches the composite actions in
# .actions, which projects never have. Projects use .templates/dependabot.yml unchanged.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.actions/*
    schedule:
      interval: monthly
    groups:
      github-actions:
        dependency-type: production
